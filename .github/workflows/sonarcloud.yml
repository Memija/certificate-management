name: SonarCloud & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, Typecheck & License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Formatting (Prettier)
        run: npm run format:check

      - name: Run Linter (ESLint + Security Rules)
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Check Staged & Local Secrets
        run: npm run security:secrets

      - name: Audit Critical NPM Vulnerabilities
        run: npm run security:audit

      - name: Audit Production Dependency Licenses
        run: npm run security:licenses

      - name: Generate Quality & Compliance Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🧹 Code Quality, Types & License Compliance" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ All Static Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Tool | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Formatting** | Prettier (`format:check`) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **Linting & Security** | ESLint + `eslint-plugin-security` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **Type Safety** | TypeScript (`tsc -b --noEmit`) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **Secret Patterns** | `scripts/check-secrets.js` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **Critical NPM Audit** | `npm audit --audit-level=critical` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **License Compliance** | `license-checker-rseidelsohn` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Static Quality or Compliance Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the step logs above for formatting, lint, type, or license violations." >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 1

      - name: Generate Unit Tests & Coverage Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node -e '
            const fs = require("fs");
            const jobStatus = process.env.JOB_STATUS;
            let md = "## 🧪 Unit Tests & Code Coverage Summary\n\n";
            let totalLF = 0;
            let totalLH = 0;
            try {
              if (fs.existsSync("coverage/lcov.info")) {
                const content = fs.readFileSync("coverage/lcov.info", "utf8");
                for (const line of content.split("\n")) {
                  if (line.startsWith("LF:")) totalLF += parseInt(line.slice(3).trim(), 10) || 0;
                  if (line.startsWith("LH:")) totalLH += parseInt(line.slice(3).trim(), 10) || 0;
                }
              }
              const coveragePct = totalLF > 0 ? ((totalLH / totalLF) * 100).toFixed(2) + "%" : "N/A";
              if (jobStatus === "success") {
                md += "### ✅ All Unit Tests Passed!\n\n";
              } else {
                md += "### ❌ Unit Tests or Coverage Check Failed\n\n";
              }
              md += "| Metric | Value |\n";
              md += "| :--- | :--- |\n";
              md += "| **Test Runner** | Vitest (`v8` provider) |\n";
              md += `| **Lines Evaluated** | \`${totalLF.toLocaleString()}\` |\n`;
              md += `| **Lines Covered** | \`${totalLH.toLocaleString()}\` |\n`;
              md += `| **Line Coverage** | **${coveragePct}** |\n`;
              md += "| **Coverage Artifact** | `coverage-report` (Retained 1 day) |\n\n";
              md += "> [!TIP]\n";
              md += "> Coverage telemetry (`lcov.info`) is passed downstream to SonarCloud.\n";
            } catch (err) {
              const status = jobStatus === "success" ? "✅ Passed" : "❌ Failed";
              md += "| Metric | Status |\n| :--- | :--- |\n| **Unit Tests** | " + status + " |\n";
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

  sonarcloud:
    name: SonarCloud Analysis
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Coverage Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate SonarCloud Scan Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🛡️ SonarCloud Static Code Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ SonarCloud Scan Completed Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Project Key** | \`Memija_certificate-management\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Organization** | \`memija\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Coverage Ingestion** | \`coverage/lcov.info\` & \`coverage/sonar-report.xml\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Quality Gate Status** | [View SonarCloud Dashboard](https://sonarcloud.io/dashboard?id=Memija_certificate-management) |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Quality gate conditions analyze new code coverage, maintainability rating (A), reliability rating (A), and zero security vulnerabilities." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ SonarCloud Scan Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review job logs and ensure \`SONAR_TOKEN\` is properly configured." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build Application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-artifact
          path: dist/
          retention-days: 1

      - name: Generate Application Build Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🏗️ Production Application Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Target Architecture** | React + Vite Single Page Application |" >> $GITHUB_STEP_SUMMARY
            echo "| **Output Directory** | \`dist/\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Artifact Name** | \`dist-artifact\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | Production Ready |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Artifact contains compiled static assets ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Application Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check build logs for compilation or bundling errors." >> $GITHUB_STEP_SUMMARY
          fi

  lighthouse:
    name: Lighthouse CI Performance & Accessibility
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-artifact
          path: dist/

      - name: Run Lighthouse CI (Mobile & Desktop)
        run: npm run lighthouse

      - name: Run Lighthouse User Flows (Quick Verification)
        run: npm run lighthouse:flows:quick

      - name: Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

      - name: Generate Lighthouse CI Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🚀 Lighthouse CI Performance & Accessibility" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ Lighthouse Audits & User Flows Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Preset | Output Directory | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Mobile** | \`.lighthouseci/mobile\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **Desktop** | \`.lighthouseci/desktop\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| **User Flows** | \`.lighthouseci/flows\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            if [ -f ".lighthouseci/flows/flow-summary.md" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              cat .lighthouseci/flows/flow-summary.md >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ❌ Lighthouse CI Assertion Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the \`lighthouse-reports\` artifact to inspect detailed HTML/JSON reports." >> $GITHUB_STEP_SUMMARY
          fi
