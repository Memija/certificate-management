name: zizmor GitHub Actions Security Audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: CI/CD Workflow Security Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF results to Security tab
      contents: read # Required to checkout repository
      actions: read # Required for zizmor to inspect actions and workflow metadata

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3

      - name: Generate zizmor Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## 🛡️ zizmor GitHub Actions Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$JOB_STATUS" = "success" ]; then
            echo "### ✅ All Clear — No CI/CD Misconfigurations Detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Target** | \`.github/workflows/\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Audit Type** | GitHub Actions Workflow Static Analysis |" >> $GITHUB_STEP_SUMMARY
            echo "| **Result** | Passed — Hardened workflows verified |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> Workflows follow least-privilege permissions, SHA pinning, and step-security runner hardening." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Security Misconfiguration Found in Workflows" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the job logs or GitHub Security tab for specific findings." >> $GITHUB_STEP_SUMMARY
          fi
